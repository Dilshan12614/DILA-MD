name: DILA-MD Bot
on:
  push:
    branches: [ main ]
  workflow_dispatch: # අතින් run කරන්න පුළුවන්

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # 6hrs වලට කලින් නැවතිලා ආයෙ start වෙනවා
    
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Install FFmpeg
        run: sudo apt-get install -y ffmpeg imagemagick

      - name: Start Bot
        run: node index.js
        env:
          # මේකෙ ඔයාගෙ .env variables දාන්න
          SESSION_ID: ${{ secrets.SESSION_ID }}
          OWNER_NUMBER: ${{ secrets.OWNER_NUMBER }}
