name: Deploy
on:
  push:
    branches: main
  pull_request:
    branches: main

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    permissions:
      id-token: write # Needed for auth with Deno Deploy
      contents: read # Needed to clone the repository

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'  # Node 20 LTS. Baileys වලට stable

      - name: Install dependencies
        run: npm install --legacy-peer-deps  # <-- මේක තමයි fix එක

      - name: Build step
        run: npm run build --if-present  # <-- start නෙමෙයි

      - name: Upload to Deno Deploy
        uses: denoland/deployctl@v1
        with:
          project: "hans-byte-54"
          entrypoint: "index.js"
          root: ""
