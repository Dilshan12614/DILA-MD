name: Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      # Install dependencies required by canvas
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libcairo2-dev \
            libpango1.0-dev \
            libjpeg-dev \
            libgif-dev \
            librsvg2-dev \
            libpixman-1-dev

      # Node.js 22
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check Node.js
        run: |
          node -v
          npm -v

      # Install project dependencies
      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps

      # Check important dependencies
      - name: Verify dependencies
        run: |
          node -e "require('canvas'); console.log('Canvas OK')"
          node -e "require('puppeteer'); console.log('Puppeteer OK')"
          node -e "require('sqlite3'); console.log('SQLite3 OK')"

      # Install Deno
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check Deno
        run: |
          deno --version

      # Deploy only when pushing to main
      - name: Deploy to Deno Deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: denoland/deployctl@v1
        with:
          project: "hans-byte-54"
          entrypoint: "index.js"
          root: "."
          token: ${{ secrets.DENO_DEPLOY_TOKEN }}
